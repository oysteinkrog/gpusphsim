# Root config: collect only the fallingsand3d tests. The repo root used to hold
# a stale copy of the project (removed; last touched in commit 8e2072c).
# Keep markers, addopts and python_files in sync with fallingsand3d/pytest.ini,
# because pytest reads only one ini file: this one when run from the repo root.
[pytest]
testpaths = fallingsand3d
markers =
    stress: 500K+ particle runs, deselected by default (run with: pytest -m stress)
    gpu: needs a CUDA device
addopts = -m "not stress"
python_files = test_*.py
